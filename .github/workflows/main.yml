name: Build Party Arena APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract Android project ZIP
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      mkdir project
      unzip -o *.zip -d project
      find project -maxdepth 4 -type f | head -100

  - name: Check Android build files
    run: |
      if ! find project -name gradlew -type f | grep -q .; then
        echo "Gradle wrapper missing; a complete Android build cannot run yet."
        exit 1
      fi
